name: Build TrimUI SD package
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM cross compiler and SDL2 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross libsdl2-dev zip
      - name: Cross compile against SDL2 ARM shared library
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/armhf.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0:armhf
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -I/usr/include/SDL2 -D_REENTRANT -o zuzu2p main.c /usr/lib/arm-linux-gnueabihf/libSDL2-2.0.so.0 -lm
          file zuzu2p
      - name: Package SD card directory
        run: |
          mkdir -p package/Apps/ZUZU2P
          cp zuzu2p launch.sh package/Apps/ZUZU2P/
          chmod +x package/Apps/ZUZU2P/*
          cd package && zip -r ../ZUZU2P-v1.0-TrimUI-armhf.zip Apps
      - uses: actions/upload-artifact@v4
        with:
          name: ZUZU2P-v1.0-TrimUI-armhf
          path: ZUZU2P-v1.0-TrimUI-armhf.zip
